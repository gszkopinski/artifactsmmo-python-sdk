[tool.poetry]
name = "artifactsmmo-sdk"
version = "0.2.5"
description = "Artifacts MMO SDK"
authors = ["Guillaume SZKOPINSKI <gszkopinski@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pydantic = { version = "^2.12.5", extras = ["email"] }
requests = "^2.32.5"
python-dotenv = "^1.2.1"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
pre-commit = "^4.5.0"
mock = "^5.1.0"
icecream = "^2.1.3"
ipdb = "^0.13.13"
types-requests = "^2.32.0.20240712"
types-mock = "^5.1.0.20240425"
pytest-xdist = "^3.6.1"
python-semantic-release = "^10.5.2"
ruff = "^0.14.9"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# TOOLS
[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
version_source = "tag"
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "poetry build"
commit_version_number = true
commit_subject = "chore(release): v{version}"
commit_message = "Released version {version}. See the changelog for changes."

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -s --log-cli-level=INFO"
testpaths = ["tests"]


[tool.pyright]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportFunctionMemberAccess = false
reportGeneralTypeIssues = false
reportPrivateUsage = false
reportUntypedFunctionDecorator = false
reportShadowedImports = false
reportUnknownVariableType = false
