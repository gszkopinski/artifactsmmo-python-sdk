[build-system]
requires = ["uv_build >= 0.12.17, <0.13.0"]
build-backend = "uv_build"

[project]
name = "artifactsmmo-sdk"
version = "0.2.5"
description = "Artifacts MMO SDK"
authors = [
    {name = "Guillaume SZKOPINSKI", email = "gszkopinski@gmail.com"}
]
maintainers = [
    {name = "Guillaume SZKOPINSKI", email = "gszkopinski@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.12.5",
    "requests>=2.32.5",
    "python-dotenv>=1.2.1",
    "rapidfuzz>=2.16.1"
]
keywords = ["artifactsmmo", "python", "sdk"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pre-commit>=4.5.0",
    "mock>=5.1.0",
    "icecream>=2.1.3",
    "ipdb>=0.13.13",
    "types-requests>=2.32.0",
    "types-mock>=5.1.0",
    "pytest-xdist>=3.6.1",
    "python-semantic-release>=10.5.2",
    "ruff>=0.14.9",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -s --log-cli-level=INFO"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_source = "tag"
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "python -m build"
commit_version_number = true
commit_subject = "chore(release): v{version}"
commit_message = "Released version {version}. See the changelog for changes."
