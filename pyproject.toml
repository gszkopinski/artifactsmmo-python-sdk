[build-system]
requires = ["uv_build >= 0.12.17, <0.13.0"]
build-backend = "uv_build"

[project]
name = "artifactsmmo-sdk"
version = "0.2.5"
description = "Artifacts MMO SDK"
authors = [
    {name = "Guillaume SZKOPINSKI", email = "gszkopinski@gmail.com"}
]
maintainers = [
    {name = "Guillaume SZKOPINSKI", email = "gszkopinski@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "python-dotenv>=1.2.1"
]
keywords = ["artifactsmmo", "python", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/gszkopinski/artifactsmmo-python-sdk"
Changelog = "https://github.com/gszkopinski/artifactsmmo-python-sdk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pre-commit>=4.5.0",
    "pytest-mock>=3.14.0",
    "icecream>=2.1.3",
    "ipdb>=0.13.13",
    "types-requests>=2.32.0",
    "pytest-xdist>=3.6.1",
    "python-semantic-release>=10.5.2",
    "ruff>=0.14.9",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -m \"not live\""
markers = ["live: tests hitting the real Artifacts API (need TOKEN and API_URL)"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501: the formatter handles it; UP042: StrEnum would change str() of enums
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
build_command = "uv build"
commit_message = "chore(release): v{version}\n\nAutomatically generated by python-semantic-release"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true
